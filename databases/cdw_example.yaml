# AutoDQA — Database Configuration Example
#
# Copy this file and fill in your CDW connection details.
# The file path is passed to run.sh via --db-config.
#
# All MCP tool servers that need database access read the DB_CONFIG
# environment variable to find this file.

id: "cdw"
name: "Clinical Data Warehouse"
engine: "mssql"
cdm: "pcornet"

connection:
  driver: "ODBC Driver 18 for SQL Server"
  server: "<SERVER_NAME>"
  database: "<DATABASE_NAME>"
  # For Windows auth:
  # trusted_connection: "yes"
  # For SQL auth:
  # uid: "<USERNAME>"
  # pwd: "<PASSWORD>"
  TrustServerCertificate: "yes"

# Path to the ETL codebase (used by etl_reader and doc_search tools)
etl_repo: "<PATH_TO_ETL_REPO>"

# Tables to profile (v1 scope)
tables:
  - DEMOGRAPHIC
  - ENCOUNTER
  - DIAGNOSIS
