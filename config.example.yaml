# AutoDQA — Configuration
#
# Copy this file to config.yaml and fill in your details.
# The file path is passed to run.sh via --config.

id: "cdw"
name: "Clinical Data Warehouse"
engine: "mssql"
cdm: "pcornet"

connection:
  server: "<SERVER_IP_OR_HOST>"   # e.g. the institutional CDW at 129.106.31.60
  port: 1433
  database: "<DATABASE_NAME>"
  # SQL auth only — the cloud sandbox connects with pytds, not Windows auth. Use a
  # READ-ONLY login (db_datareader); the grant is the entire read-only guarantee.
  # For a password with special characters, single-quote the value in YAML.
  uid: "<USERNAME>"
  pwd: "<PASSWORD>"
  # If the server requires TLS, pytds negotiates it; "yes" trusts the server cert
  # without CA validation (OK for synthetic data — use a validated CA cert for real
  # CDW). NOTE: not yet plumbed into the pytds runner (tool_query_cdw.py).
  TrustServerCertificate: "yes"

sources:
  etl:
    path: "<PATH_TO_ETL_REPO>"
  documentation:
    paths:
      - "<PATH_TO_ETL_REPO>/Documentation"
      - "<PATH_TO_ETL_REPO>/docs"

# Tables to profile (v1 scope)
tables:
  - DEMOGRAPHIC
  - ENCOUNTER
  - DIAGNOSIS
